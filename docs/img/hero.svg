<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="16" fill="#F7F5F0"/>

  <!-- 1. you say -->
  <g transform="translate(30,60)">
    <rect width="240" height="150" rx="14" fill="#FFFFFF" stroke="#E7E8D1" stroke-width="2"/>
    <circle cx="36" cy="38" r="20" fill="#B85042"/>
    <path d="M27 30 h18 a4 4 0 0 1 4 4 v9 a4 4 0 0 1 -4 4 h-9 l-6 5 v-5 h-3 a4 4 0 0 1 -4 -4 v-9 a4 4 0 0 1 4 -4 z" fill="#FFFFFF"/>
    <text x="68" y="44" font-size="15" font-weight="700" fill="#2B2B2B">You say</text>
    <rect x="18" y="66" width="204" height="64" rx="12" fill="#E7E8D1"/>
    <text x="30" y="92" font-size="13.5" fill="#2B2B2B">“remind me to buy</text>
    <text x="30" y="112" font-size="13.5" fill="#2B2B2B">toothpaste at 5”</text>
    <text x="18" y="146" font-size="10.5" fill="#6B6B6B">Claude · laptop or phone · any language</text>
  </g>

  <!-- arrow 1 -->
  <line x1="278" y1="135" x2="330" y2="135" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="304" y="123" font-size="10" fill="#6B6B6B" text-anchor="middle">one JSON file</text>

  <!-- 2. daemon -->
  <g transform="translate(340,60)">
    <rect width="240" height="150" rx="14" fill="#2E2A28"/>
    <circle cx="36" cy="38" r="20" fill="#B85042"/>
    <rect x="27" y="29" width="18" height="18" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="32" y="34" width="8" height="8" fill="#FFFFFF"/>
    <text x="68" y="44" font-size="15" font-weight="700" fill="#FFFFFF">Daemon on the Mac</text>
    <text x="18" y="80" font-size="12" fill="#E7E8D1">wakes every minute</text>
    <text x="18" y="100" font-size="12" fill="#E7E8D1">reads the file · writes SQLite</text>
    <text x="18" y="120" font-size="12" fill="#E7E8D1">arms the reminder · logs every change</text>
    <text x="18" y="146" font-size="10.5" fill="#A7BEAE">~500 lines of Python, stdlib only</text>
  </g>

  <!-- arrow 2 -->
  <line x1="588" y1="135" x2="640" y2="135" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="614" y="123" font-size="10" fill="#6B6B6B" text-anchor="middle">iCloud</text>

  <!-- 3. phone -->
  <g transform="translate(650,60)">
    <rect width="280" height="150" rx="14" fill="#FFFFFF" stroke="#E7E8D1" stroke-width="2"/>
    <circle cx="36" cy="38" r="20" fill="#B85042"/>
    <rect x="29" y="27" width="14" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="36" cy="45" r="1.5" fill="#FFFFFF"/>
    <text x="68" y="44" font-size="15" font-weight="700" fill="#2B2B2B">Your phone buzzes</text>
    <rect x="18" y="66" width="244" height="46" rx="8" fill="#F7F5F0" stroke="#E7E8D1"/>
    <circle cx="38" cy="89" r="9" fill="none" stroke="#B85042" stroke-width="2"/>
    <text x="54" y="85" font-size="12.5" font-weight="700" fill="#2B2B2B">[T001] buy toothpaste</text>
    <text x="54" y="102" font-size="10.5" fill="#B85042">17:00 · then every 30 min</text>
    <text x="18" y="134" font-size="11" fill="#6B6B6B">Apple Reminders · already on your phone</text>
    <text x="18" y="146" font-size="10.5" fill="#6B6B6B">works even if the laptop is asleep</text>
  </g>

  <!-- loop back: tick -->
  <path d="M790 218 C 790 262, 480 262, 460 262 C 200 262, 150 262, 150 218" fill="none" stroke="#A7BEAE" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <rect x="380" y="246" width="200" height="32" rx="16" fill="#A7BEAE"/>
  <circle cx="404" cy="262" r="9" fill="#FFFFFF"/>
  <path d="M399 262 l4 4 l7 -8" fill="none" stroke="#B85042" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="422" y="267" font-size="12.5" font-weight="700" fill="#2B2B2B">tick it → done, logged, gone</text>

  <text x="480" y="30" font-size="13" fill="#6B6B6B" text-anchor="middle">Nothing talks to a running process. The chat writes a file; the daemon reads and writes files. That's the whole contract.</text>
</svg>
